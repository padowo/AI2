App\Entity\Location:
    constraints:
        - Symfony\Bridge\Doctrine\Validator\Constraints\UniqueEntity:
              fields: [city, country]
              message: 'Taka lokalizacja już istnieje.'
              groups: [create]
    properties:
        city:
            - NotBlank:
                  message: 'Podaj nazwę miasta.'
                  groups: [create, edit]
            - Length:
                  min: 2
                  max: 255
                  groups: [create]
        country:
            - NotBlank:
                  groups: [create, edit]
        latitude:
            - NotBlank:
                  groups: [create]
            - Range:
                  min: -90
                  max: 90
                  groups: [create, edit]
        longitude:
            - NotBlank:
                  groups: [create]
            - Range:
                  min: -180
                  max: 180
                  groups: [create, edit]

App\Entity\Measurement:
    properties:
        location:
            - NotBlank:
                  groups: [create, edit]
        date:
            - NotBlank:
                  groups: [create, edit]
            - GreaterThanOrEqual:
                  value: today
                  message: 'Prognoza nie może dotyczyć przeszłości.'
                  groups: [create]
        celsius:
            - NotBlank:
                  groups: [create, edit]
            - Range:
                  min: -60
                  max: 60
                  groups: [create]
            - Range:
                  min: -90
                  max: 70
                  groups: [edit]
